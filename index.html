<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleStory Farming Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ff8a4c' stroke-width='4'/%3E%3Cpath d='M16 9v8l5 3' stroke='%23ff8a4c' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#121722;--surface:#1b2230;--sunk:#141a26;--raise:#232b3b;--fg:#e8ecf4;--muted:#98a3b6;--line:#2e384b;
  --accent:#ff8a4c;--on-accent:#1a1208;--good:#4cc38a;--bad:#e0484d;--warn:#e0b050;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif;
  --head:232px;--tail:36px;
}
:root[data-theme="light"]{
  --bg:#eef1f6;--surface:#ffffff;--sunk:#e3e8f0;--raise:#f4f6fa;--fg:#1a2233;--muted:#5b6679;--line:#cfd6e2;
  --accent:#d9541e;--on-accent:#ffffff;--good:#1f8a4c;--bad:#c93b3f;--warn:#a96a12;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 .logo{width:26px;height:26px}
h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel+.panel{margin-top:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn:disabled,select.sel:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.icon{padding:7px;width:36px;height:36px}
.btn.ghost{background:transparent}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);border-color:var(--good);color:#0b1912}
.btn.bad{background:color-mix(in oklab,var(--bad) 18%,var(--sunk));border-color:color-mix(in oklab,var(--bad) 55%,var(--line));color:var(--fg)}
.btn.big{font-family:var(--display);font-size:18px;padding:12px 22px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
select.sel,input.inp{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;min-width:0}
select.sel:focus,input.inp:focus{border-color:var(--accent)}
.tpl{font-family:var(--display);font-weight:700;font-size:15px}

/* live */
.live{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.clock{position:relative;width:180px;height:180px}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .ring-bg{stroke:var(--sunk)}
.clock .ring{stroke:var(--accent);transition:stroke-dashoffset .3s linear}
.clock .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock .time{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock .sub{color:var(--muted);font-size:13px}
.nexts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.next{--c:var(--accent);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.next .nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .cd{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.next .ct{position:absolute;right:10px;top:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.next.soon{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in oklab,var(--c) 35%,transparent)}
.next.done .cd{color:var(--good)}
.check{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--good);color:#0b1912;align-items:center;justify-content:center}
.check svg{width:16px;height:16px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted);margin-left:auto}
.vol input{accent-color:var(--accent);width:110px}
.vol svg{width:18px;height:18px}
.resume{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);color:var(--accent);font-weight:600;cursor:pointer;background:transparent;width:100%}
.resume.show{display:block}

/* timeline */
.tl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tl-head .len{margin-left:auto;color:var(--muted);font-size:13px}
.timeline{position:relative;user-select:none;-webkit-user-select:none}
.ruler,.lane{display:grid;grid-template-columns:var(--head) 1fr var(--tail);align-items:center}
.ldel{justify-self:center;width:28px;height:28px;padding:5px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:flex;opacity:0;transition:opacity .15s,color .15s,background .15s}
.ldel svg{width:16px;height:16px}
.lane:hover .ldel{opacity:1}
.ldel:hover{color:var(--bad);background:color-mix(in oklab,var(--bad) 14%,transparent)}
.farmlock .ldel{visibility:hidden}
.ruler{height:34px}
.ruler .bar{position:relative;height:100%;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:0;height:8px;border-left:1px solid var(--line)}
.tick span{position:absolute;bottom:9px;left:0;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.after{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklab,var(--line) 55%,transparent) 6px 7px);pointer-events:none}
.endh{position:absolute;top:2px;bottom:-1px;width:16px;margin-left:-8px;cursor:ew-resize;touch-action:none;z-index:3}
.endh::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--accent)}
.endh.flip::after{left:auto;right:12px}
.endh::after{content:attr(data-label);position:absolute;top:-1px;left:12px;font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:4px}
.lane{min-height:58px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);border-radius:8px;transition:background .15s}
.lane.sel{background:color-mix(in oklab,var(--c) 9%,transparent)}
.lane:hover{background:color-mix(in oklab,var(--c) 6%,transparent)}
.lhead{--c:var(--accent);display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;cursor:pointer;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 25%,transparent)}
.lhead .tx{min-width:0;flex:1}
.grip{display:flex;align-items:center;color:var(--muted);cursor:grab;padding:4px 0;touch-action:none;opacity:.45;transition:opacity .15s}
.lane:hover .grip{opacity:1}
.grip svg{width:12px;height:16px}
.lane.ghost{position:fixed;z-index:100;margin:0;pointer-events:none;background:var(--surface);border-radius:10px;border:0;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1.5px var(--c);transform:scale(1.015);opacity:.97}
.lane.ghost.drop{transform:none;box-shadow:0 4px 12px rgba(0,0,0,.3),0 0 0 1px var(--c)}
.lane.ghost .grip{opacity:1;color:var(--fg)}
.lane.ph{background:transparent;border-radius:10px;box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--c) 45%,transparent)}
.lane.ph>*{visibility:hidden}
.lane.moving{background:color-mix(in oklab,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c);position:relative;z-index:5}
body.reordering,body.reordering *{cursor:grabbing!important;user-select:none}
.lhead .nm{cursor:text;border-radius:4px;padding:0 3px;margin:0 -3px}
.lhead .nm:hover{background:color-mix(in oklab,var(--c) 18%,transparent)}
.lhead .nmin{width:100%;font-weight:600;background:var(--surface);border:1px solid var(--accent);border-radius:5px;padding:1px 5px;outline:none}
.mute{background:transparent;border:0;color:var(--muted);padding:4px;border-radius:6px;display:flex;opacity:0;transition:opacity .15s;position:relative;z-index:9}
.farmlock .mute{opacity:.8}
.lane:hover .mute,.mute.on{opacity:1}
.mute:hover{color:var(--fg);background:var(--surface)}
.mute.on{color:var(--bad)}
.mute svg{width:16px;height:16px}
.lane.muted .ltrack{opacity:.4}
.lane.muted .lhead .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.next.muted .cd,.next.muted .nm{opacity:.55}
.nmute{position:absolute;right:6px;bottom:6px;width:28px;height:28px;padding:5px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:flex;opacity:0;transition:opacity .15s}
.next:hover .nmute,.nmute.on{opacity:1}
.nmute:hover{background:var(--surface);color:var(--fg)}
.nmute.on{color:var(--bad)}
.nmute svg{width:18px;height:18px}
@media (hover:none){.nmute{opacity:.6}}
.pillin,.endin{position:absolute;z-index:6;font:700 12.5px var(--body);text-align:center;background:var(--surface);border:1.5px solid var(--accent);border-radius:999px;outline:none;color:var(--fg);padding:2px 6px}
.pillin{top:50%;transform:translate(10px,-50%);width:64px}
.endin{top:0;transform:translateX(-50%);width:84px;border-radius:6px}
.lhead .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .sm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ltrack{position:relative;height:58px;touch-action:none;cursor:default}
.ltrack .rail{position:absolute;left:0;right:0;top:50%;height:2px;background:color-mix(in oklab,var(--c) 30%,transparent);transform:translateY(-50%)}
.mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c);border:2px solid var(--surface);cursor:grab;transition:transform .12s,opacity .2s;z-index:2}
.mk:hover{transform:scale(1.3)}
.mk.first{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:6px}
.mk.last{box-shadow:0 0 0 2px var(--c)}
.mk.mutedmk{opacity:.45}
.mk.offmk{background:var(--surface);box-shadow:inset 0 0 0 2px var(--c)}
.mk.cut{background:transparent;border:2px dashed var(--bad);cursor:default;opacity:.7}
.mk.played{opacity:.35}
.mk.nextup{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--c) 70%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in oklab,var(--c) 0%,transparent)}}
.cnt{position:absolute;top:50%;transform:translate(10px,-50%);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in oklab,var(--c) 22%,var(--sunk));border:1px solid color-mix(in oklab,var(--c) 50%,var(--line));cursor:ew-resize;white-space:nowrap;z-index:2}
.cnt.flip{transform:translate(calc(-100% - 10px),-50%)}
.cnt.one{opacity:0;transition:opacity .15s}
.lane:hover .cnt.one,.lane.sel .cnt.one{opacity:1}
@media (hover:none){.kb{display:none}}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none;z-index:4;display:none}
.playhead::before{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--fg)}
.playhead.show{display:block}
.timeline.locked .mk,.timeline.locked .cnt,.timeline.locked .endh{cursor:default}
.lockable{position:relative}
.lockveil{position:absolute;inset:0;z-index:8;border-radius:12px;background:color-mix(in oklab,var(--bg) 38%,transparent);display:flex;align-items:flex-start;justify-content:center;padding-top:14px;cursor:not-allowed}
.lockpill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.lockpill svg{width:16px;height:16px;color:var(--accent)}
.add{margin-top:10px;width:100%;border-style:dashed;background:transparent;color:var(--muted)}
.add:hover{color:var(--fg)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--raise);color:var(--fg);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-130%);display:none;font-variant-numeric:tabular-nums}
.tip.show{display:block}

/* inspector */
.insp{display:none;margin-top:12px;padding:14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.insp.show{display:block}
.insp{position:relative}
.insp-x{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:5px}
.insp .fields{padding-right:28px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f .inp,.f .sel{width:100%}
.f.wide{grid-column:span 2}
.iacts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.sw button.on{border-color:var(--fg)}
.step{display:flex;align-items:stretch}
.step .inp{text-align:center;border-radius:0;width:60px}
.step button{width:34px;background:var(--surface);border:1px solid var(--line)}
.step button:first-child{border-radius:8px 0 0 8px}
.step button:last-child{border-radius:0 8px 8px 0}
.with{display:flex;gap:6px}
.each{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.each-h{font-size:12px;color:var(--muted);margin-bottom:8px}
.each-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.er{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;border-radius:8px;border:1px solid transparent}
.er.own{border-color:color-mix(in oklab,var(--accent) 45%,var(--line));background:color-mix(in oklab,var(--accent) 7%,transparent)}
.er.cut{opacity:.4}
.er .en{width:20px;font-weight:700;color:var(--muted);font-size:12.5px;text-align:right;flex:none}
.er .et{width:52px;font-variant-numeric:tabular-nums;font-size:13px;flex:none}
.er .sel{flex:1;min-width:0;padding:5px 8px;font-size:13px}
.er .btn.icon{width:30px;height:30px;padding:5px}
.with .sel{flex:1}

/* sounds */
.snd-head{gap:14px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.chk .sel{padding:4px 8px;font-size:13px}
.sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.snd{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px}
.snd .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border-radius:4px;padding:1px 3px}
.snd .nm[contenteditable="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--accent)}
.snd .play{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0;background:color-mix(in oklab,var(--accent) 18%,var(--surface));border:1px solid color-mix(in oklab,var(--accent) 45%,var(--line))}
.snd .play.on{background:var(--accent);color:var(--on-accent)}
.snd .x{background:transparent;border:0;color:var(--muted);padding:4px;border-radius:6px}
.snd .x:hover{color:var(--fg);background:var(--surface)}
.snd svg{width:16px;height:16px;display:block}
.snd .play svg{width:18px;height:18px;transform:translateX(1px)}
.btn.icon svg{margin:auto}
.drop{border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:600;min-height:50px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,transparent)}
.drop svg{width:18px;height:18px}

/* menu + toast */
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:170px;box-shadow:0 8px 26px rgba(0,0,0,.45);display:none;z-index:20}
.menu.open .pop{display:block}
.pop button{display:flex;width:100%;gap:8px;align-items:center;background:transparent;border:0;padding:8px 10px;border-radius:7px;text-align:left}
.pop button:hover{background:var(--sunk)}
.pop button.danger{color:var(--bad)}
.pop svg{width:16px;height:16px}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.show{display:flex}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(420px,100%);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.dialog h3{font-family:var(--display);font-size:20px;margin:0 0 4px}
.dialog .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;background:color-mix(in oklab,var(--c) 16%,var(--sunk));border:1px solid color-mix(in oklab,var(--c) 45%,var(--line))}
.chip .dot{width:8px;height:8px;box-shadow:none}
.dialog .row{justify-content:flex-end}
[hidden]{display:none!important}
.av{--c:var(--accent);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-family:var(--display);font-weight:700;font-size:12px;color:#0b0f17;background:var(--c)}
.namepill{display:inline-flex;align-items:center;gap:7px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;font-weight:600;max-width:220px}
.namepill:hover{border-color:var(--muted)}
.namepill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namepill input{background:transparent;border:0;outline:none;width:140px;font-weight:600}
.namewrap{position:relative}
.namepop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.namepop .lbl{font-size:12px;color:var(--muted);margin-bottom:7px}
.namepop .sw{width:174px}
:root[data-theme="light"] .chatlog b{color:var(--c2,var(--c))}
.hint b{color:var(--c)}
:root[data-theme="light"] .hint b{color:var(--c2,var(--c))}
.netdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.netdot.on{background:var(--good)}
.netdot.connecting{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.lobby-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.code-in{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;width:110px;font-weight:700;text-align:center}
.code-in::placeholder{letter-spacing:.05em;font-weight:500}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.roomcard{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.roomcard:hover{border-color:var(--accent)}
.roomcard .tt{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomcard .ds{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.roomcard .bt{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.seats{display:flex;gap:4px}
.seats i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.seats i.f{background:var(--good);border-color:var(--good)}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.live{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:12px;display:flex;gap:10px;align-items:center;justify-content:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.form{display:none;gap:10px;grid-template-columns:1fr 1.4fr auto auto;align-items:end;margin:0 0 12px;padding:12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.form.show{display:grid}
.room-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.room-top .tt{font-family:var(--display);font-size:20px;font-weight:700}
.codechip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.14em;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.codechip:hover{border-color:var(--accent);color:var(--accent)}
.codechip svg{width:14px;height:14px}
.room-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.wrap.inroom{max-width:1500px}
.wrap.inroom .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.side{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 28px);overflow:hidden}
.side-top{display:flex;align-items:center;gap:8px}
.side-title{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25;word-break:break-word}
.side .chat{flex:1;min-height:200px;height:auto}
.side #rSave{align-self:center}
.form.vert{grid-template-columns:1fr;margin:0}
.badge.mode{font-size:12px;padding:3px 9px}
.seatno{width:18px;color:var(--muted);font-size:12px;font-weight:700;text-align:center;flex:none}
.seat .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.seat:hover .acts,.seat:focus-within .acts{opacity:1}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{width:100%}
.actions .row{flex-wrap:nowrap}
.actions .row .btn{flex:1}
.actions .hint{text-align:center}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.status .netdot{width:9px;height:9px}
.seatlist{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:46px;text-align:left}
.seat.off{opacity:.5}
.voicebots{display:flex;flex-direction:column;gap:6px;margin-top:-4px}
.vbot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:10px;border:1px dashed var(--line)}
.vbot svg{width:16px;height:16px;flex:none;color:#5865f2}
.vbot b{color:var(--fg);font-weight:600}
.seat.open{border-style:dashed;color:var(--muted);font-weight:600;width:100%;background:transparent}
.seat.open:hover{border-color:var(--accent);color:var(--accent)}
.seat .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .you{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px}
.crown{color:#f0b93a;width:24px;height:24px;flex:none;display:inline-flex;cursor:default;filter:drop-shadow(0 0 6px rgba(240,185,58,.45))}
.crown svg{width:100%;height:100%}
.rstate{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);border:1px solid var(--line);flex:none}
.rstate.ok{background:var(--good);color:#0b1912;border-color:var(--good)}
.rstate svg{width:13px;height:13px}
.kick{background:transparent;border:0;color:var(--muted);padding:4px;border-radius:6px;display:flex}
.kick:hover{color:var(--bad);background:var(--surface)}
.kick svg{width:15px;height:15px}
.chat{display:flex;flex-direction:column;background:var(--sunk);border:1px solid var(--line);border-radius:10px;height:230px}
.chatlog{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px;word-break:break-word}
.chatlog .sys{color:var(--muted);font-size:12.5px}
.chatlog > div{padding:0 10px}
.chatlog .sys.good,.chatlog .sys.bad,.chatlog .sys.warn{border:1px solid var(--t);border-radius:8px;padding:3px 9px;margin:1px 0;background:color-mix(in oklab,var(--t) 8%,transparent)}
.chatlog .sys.good{--t:var(--good)}
.chatlog .sys.bad{--t:var(--bad)}
.chatlog .sys.warn{--t:var(--warn)}
.chatlog b{color:var(--c);font-weight:600}
.chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);margin:0}
.chatin .inp{flex:1}
.rdy{width:min(380px,100%);text-align:center}
.rdy .seatlist{margin:14px 0}
.rdytime{display:flex;align-items:center;gap:10px;margin-top:6px}
.rdybar{flex:1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.rdybar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:999px;transition:width .25s linear}
.rdybar i.low{background:var(--bad)}
#rdyLeft{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted);min-width:28px;text-align:right}
.count{font-family:var(--display);font-weight:700;font-size:96px;line-height:1;color:var(--accent);margin:14px 0 4px}
.confd{text-align:center;width:min(360px,100%)}
.confd .row{justify-content:center;margin-top:6px}
.confav{display:flex;justify-content:center;align-items:center;gap:8px;margin:4px 0 12px}
.confav .av{width:44px;height:44px;font-size:20px}
.confav .crown{width:30px;height:30px}
.endd{text-align:center;width:min(400px,100%)}
.endd .row{justify-content:center}
.endicon{width:58px;height:58px;border-radius:50%;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;background:var(--good);color:#0b1912;animation:pop .35s ease-out}
.endicon.stopped{background:color-mix(in oklab,var(--bad) 22%,var(--sunk));color:var(--bad);border:1px solid color-mix(in oklab,var(--bad) 50%,var(--line))}
.endicon svg{width:30px;height:30px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.endstats{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px;text-align:left}
.endstats .st{--c:var(--accent);display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.endstats .st .dot{width:10px;height:10px;box-shadow:none}
.endstats .st .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.endstats .st .v{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.endstats .st .v.full{color:var(--good)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 10px 9px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 26px rgba(0,0,0,.45);transition:opacity .2s,transform .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:4px 8px;border-radius:6px}
.toast button:hover{background:var(--sunk)}
kbd{font:600 11px var(--body);background:var(--sunk);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px}

@media (max-width:980px){
  .wrap.inroom .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side .chat{height:280px;flex:none}
}
@media (max-width:720px){
  :root{--head:120px;--tail:30px}
  .ldel{opacity:.6}
  .form{grid-template-columns:1fr}
  .namepill span:last-child{max-width:90px}
  .live{grid-template-columns:1fr;justify-items:center}
  .clock{width:160px;height:160px}
  .vol{margin-left:0}
  .lhead .sm{display:none}
  .f.wide{grid-column:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg class="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="3.5"/><path d="M16 9v8l5 3" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>MapleStory Farming Timer</h1>
    <select class="sel tpl" id="tplSel" aria-label="Template"></select>
    <span class="tpl" id="guestPreset" hidden></span>
    <div class="menu" id="tplMenu">
      <button class="btn icon ghost" id="tplMenuBtn" aria-label="Template options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="pop">
        <button data-tpl="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New</button>
        <button data-tpl="dup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>Duplicate</button>
        <button data-tpl="ren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rename</button>
        <button data-tpl="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>Reset Farm 3-3</button>
        <button data-tpl="del" class="danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>Delete</button>
      </div>
    </div>
    <button class="btn ghost" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Copy link</button>
    <span class="badge mode" id="modeBadge">Local</span>
    <button class="btn ghost" id="lobbyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span id="lobbyTx">Rooms</span><span class="netdot" id="netDot"></span></button>
    <div class="spacer"></div>
    <div class="namewrap"><button class="namepill" id="nameBtn"></button><div class="namepop" id="namePop" hidden></div></div>
    <button class="btn icon ghost" id="themeBtn" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </header>

  <div class="layout">
  <div class="main">
  <section class="panel" id="lobbyPanel" hidden>
    <div class="row"><h2>Rooms</h2><span class="spacer"></span><button class="btn icon ghost" id="lobbyClose" aria-label="Close rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="lobby-top">
      <button class="btn accent" id="newRoomBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create room</button>
      <form id="codeForm" class="row" style="margin:0"><input class="inp code-in" id="codeIn" placeholder="CODE" maxlength="300" autocomplete="off" spellcheck="false"><button class="btn">Join</button></form>
    </div>
    <div class="form" id="createForm">
      <div class="f"><label>Title</label><input class="inp" id="cTitle" maxlength="50"></div>
      <div class="f"><label>Description</label><input class="inp" id="cDesc" maxlength="160" placeholder="Optional"></div>
      <div class="f"><label>Who can join</label><div class="seg" id="cVis"><button type="button" data-v="1" class="on">Public</button><button type="button" data-v="0">Private</button></div></div>
      <button class="btn accent" id="cGo">Create</button>
    </div>
    <div id="roomList"></div>
  </section>

  <section class="panel">
    <div class="live">
      <div class="clock">
        <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="44" fill="none" stroke-width="7"/><circle class="ring" id="ring" cx="50" cy="50" r="44" fill="none" stroke-width="7" stroke-linecap="round"/></svg>
        <div class="center"><div class="time" id="bigTime">30:00</div><div class="sub" id="bigSub">ready</div></div>
      </div>

        <div class="nexts" id="nexts"></div>
        <div class="controls" id="controls"></div>
        <button class="resume" id="resumeBtn">Tap to turn the sound back on</button>
      </div>
    </div>
  </section>

  <section class="panel lockable" id="tlPanel">
    <div class="lockveil" id="lockVeil" hidden><span class="lockpill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Locked while farming</span></div>

    <div class="sounds" id="sounds"></div>

  </div>

      <button class="btn bad" id="rLeave">Leave</button>

      <div class="side-title" id="rTitle"></div>

  </div>

function load() {
  try { S.templates = JSON.parse(localStorage.getItem(KEY.tpl)) || []; } catch (e) { S.templates = []; }
  if (!S.templates.length) S.templates = [farm33()];
  if (!localStorage.getItem("ft.m1")) {
    S.templates.forEach(t => {
      if (t.id !== "farm33") return;
      const tr = t.tracks.find(x => x.name === "Start" && x.first === 0 && x.sound === "meow3" && x.count === 1);
      if (tr) { tr.name = "Buff"; tr.first = 20; }

  }
  S.cur = localStorage.getItem(KEY.cur);

  const v = parseFloat(localStorage.getItem(KEY.vol)); if (!isNaN(v)) S.vol = v;

  try { S.mutes = new Set(JSON.parse(localStorage.getItem("ft.mutes")) || []); } catch (e) { S.mutes = new Set(); }
  // older versions saved mute inside the preset: move it to this browser's own list
  S.templates.forEach(t => t.tracks.forEach(tr => { if (tr.muted) S.mutes.add(tr.id); delete tr.muted; migrateLast(tr); }));
  saveMutes();
  try { S.run = JSON.parse(localStorage.getItem(KEY.run)); } catch (e) { S.run = null; }
  document.documentElement.dataset.theme = localStorage.getItem(KEY.theme) || "dark";

// sound for repeat number i (0 = first). "off" means that one stays silent.
function soundAt(tr, i) {
  if (tr.each && tr.each[i]) return tr.each[i];
  if (tr.last && tr.count > 1 && i === tr.count - 1) return tr.last;   // older presets
  return tr.sound;
}
function migrateLast(tr) {
  if (tr.last) { tr.each = tr.each || {}; if (!tr.each[tr.count - 1]) tr.each[tr.count - 1] = tr.last; }
  tr.last = null;
}

/* ---------- time helpers ---------- */
function fmt(t, dec) {
  const neg = t < 0; t = Math.abs(t);
  let m = Math.floor(t / 60), s = t - m * 60;
  let ss = dec && Math.abs(s - Math.round(s)) > 0.001 ? s.toFixed(1) : String(Math.round(s));
  if (ss === "60" || ss === "60.0") { m += 1; ss = "0"; }
  if (parseFloat(ss) < 10) ss = "0" + ss;
  return (neg ? "-" : "") + m + ":" + ss;
}
const cd = t => fmt(Math.max(0, Math.ceil(t - 0.0001)));
function parseTime(str) {
  str = String(str).trim().toLowerCase();
  if (!str) return null;
  let m = str.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (m) return +m[1] * 60 + +m[2];
  m = str.match(/^(?:(\d+(?:\.\d+)?)m)?\s*(?:(\d+(?:\.\d+)?)s?)?$/);
  if (m && (m[1] || m[2])) return (+m[1] || 0) * 60 + (+m[2] || 0);
  return null;
}
const snap = (v, step) => Math.round(v / step) * step;

function events(t) {
  const out = [];
  t.tracks.forEach(tr => {
    for (let i = 0; i < tr.count; i++) {
      const at = tr.first + i * (tr.every || 0);
      const sound = soundAt(tr, i);
      out.push({at, sound, tr, n:i + 1, cut: at >= t.length, muted: isMuted(tr.id) || sound === "off"});
      if (!tr.every) break;
    }
  });
  return out.sort((a, b) => a.at - b.at);
}
const playable = t => events(t).filter(e => !e.cut && !e.muted);
const visible = t => events(t).filter(e => !e.cut);

const idb = {
  db:null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("farmtimer", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("sounds", {keyPath:"id"});
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode) { return this.db.transaction("sounds", mode).objectStore("sounds"); },
  all() { return new Promise(res => { const r = this.tx("readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },
  put(v) { return new Promise(res => { const r = this.tx("readwrite").put(v); r.onsuccess = r.onerror = () => res(); }); },
  del(id) { return new Promise(res => { const r = this.tx("readwrite").delete(id); r.onsuccess = r.onerror = () => res(); }); }
};

    h += `<div class="${cls}" data-i="${i}" data-at="${at}" data-tid="${tr.id}" style="left:${pct(at)}" data-tip="${esc(tr.name)}${tr.count > 1 ? " " + (i + 1) : ""} \u00b7 ${fmt(at, true)} \u00b7 ${snd === "off" ? "silent" : esc(soundName(snd))}"></div>`;
    lastAt = at;
    if (!tr.every) break;
  }
  const one = tr.count === 1;
  const flip = lastAt / scale() > 0.8 && document.documentElement.clientWidth < 720;
  h += `<div class="cnt ${one ? "one" : ""} ${flip ? "flip" : ""}" data-act="count" style="left:${pct(lastAt)}">${one ? "+ repeat" : "\u00d7" + tr.count}</div>`;
  return h;
}
function updateLane(tr) {
  const el = document.querySelector(`.ltrack[data-id="${tr.id}"]`);
  if (!el) return;
  el.innerHTML = `<div class="rail"></div>${markersHTML(tr)}`;

}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dragging ---------- */
function timeAt(clientX, el) {
  const r = el.getBoundingClientRect();
  return Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * scale();
}
function showTip(x, y, text) { const tip = $("#tip"); tip.textContent = text; tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("show"); }
function hideTip() { $("#tip").classList.remove("show"); }

function dragLane(e, el) {
  if (!canEdit()) return;
  const tr = track(el.dataset.id);
  const target = e.target;
  select(tr.id, true);
  const isCount = target.dataset.act === "count";
  const isMk = target.classList.contains("mk") && !target.classList.contains("cut");
  if (!isCount && !isMk) return;
  e.preventDefault();
  const i = isMk ? +target.dataset.i : null;
  const before = JSON.stringify(tpl());
  const start = {x: e.clientX, first: tr.first, every: tr.every, count: tr.count};
  let moved = false;
  S.frozenScale = scale(); S.dragging = true;
  el.setPointerCapture(e.pointerId);
  const move = ev => {
    if (!moved && Math.abs(ev.clientX - start.x) < 3) return;
    moved = true;
    const fine = ev.shiftKey, t = timeAt(ev.clientX, el);
    let label;
    if (isCount) {
      if (!tr.every) tr.every = 60;
      tr.count = Math.max(1, Math.min(200, Math.round((t - tr.first) / tr.every) + 1));
      label = `\u00d7${tr.count}`;
    } else if (i === 0) {
      tr.first = Math.max(0, snap(t, fine ? 0.1 : 1));
      label = `starts ${fmt(tr.first, true)}`;
    } else {
      tr.every = Math.max(1, snap((t - tr.first) / i, fine ? 0.1 : 0.5));
      label = `every ${fmt(tr.every, true)}`;
    }
    updateLane(tr);
    showTip(ev.clientX, el.getBoundingClientRect().top, label);
  };
  const up = () => {
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", up);
    el.removeEventListener("pointercancel", up);
    S.dragging = false; hideTip();
    S.frozenScale = null;
    if (moved) {
      pushUndo(before, `${tr.name} changed`);
      save(); liveChanged(); renderLanes(); renderInspector();
    } else if (isCount) {
      editCount(tr, el);
    } else if (isMk) {
      const snd = soundAt(tr, +target.dataset.i);
      if (snd !== "off") preview(snd);
    }
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
}

function dragEnd(e) {
  if (!canEdit()) return;
  e.preventDefault();
  const h = e.currentTarget, bar = $("#ruler"), t = tpl();
  const before = JSON.stringify(t);
  S.frozenScale = scale(); S.dragging = true;
  h.setPointerCapture(e.pointerId);
  let moved = false;
  const move = ev => {
    moved = true;
    t.length = Math.max(30, snap(timeAt(ev.clientX, bar), ev.shiftKey ? 1 : 15));
    h.style.left = pct(t.length);
    h.dataset.label = fmt(t.length, true) + " end";
    bar.querySelector(".after").style.left = pct(t.length);
    document.querySelectorAll(".mk[data-at]").forEach(m => m.classList.toggle("cut", +m.dataset.at >= t.length));
    showTip(ev.clientX, bar.getBoundingClientRect().top + 6, `length ${fmt(t.length, true)}`);
    tick();
  };
  const up = () => {
    h.removeEventListener("pointermove", move);
    h.removeEventListener("pointerup", up);
    h.removeEventListener("pointercancel", up);
    S.dragging = false; hideTip(); S.frozenScale = null;
    if (moved) { pushUndo(before, "Length changed"); save(); liveChanged(); renderLanes(); }
    else editLength();
  };
  h.addEventListener("pointermove", move);
  h.addEventListener("pointerup", up);
  h.addEventListener("pointercancel", up);
}

document.addEventListener("pointerover", e => {
  const m = e.target.closest && e.target.closest("[data-tip]");
  if (m && !S.dragging) {
    const r = m.getBoundingClientRect();
    showTip(r.left + r.width / 2, r.top, m.dataset.tip);
  }
});
document.addEventListener("pointerout", e => { if (!S.dragging && e.target.closest && e.target.closest("[data-tip]")) hideTip(); });

/* ---------- lane tools: rename, reorder, mute, type-in boxes ---------- */
function editTpl(label, fn) {
  if (!canEdit()) return;
  const before = JSON.stringify(tpl());
  fn();
  pushUndo(before, label);
  save(); liveChanged(); renderLanes(); renderInspector();
}
function renameLane(id, nmEl) {
  const tr = track(id); if (!tr) return;
  const inp = document.createElement("input");
  inp.className = "nmin"; inp.maxLength = 40; inp.value = tr.name;
  nmEl.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    const v = inp.value.trim().slice(0, 40);
    if (keep && v && v !== tr.name) editTpl("Renamed", () => { tr.name = v; });
    else renderLanes();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
}
function removeTrack(id) {
  const t = tpl(), tr = t.tracks.find(x => x.id === id);
  if (!tr) return;
  editTpl(`${tr.name} removed`, () => { t.tracks = t.tracks.filter(x => x.id !== id); if (S.sel === id) S.sel = null; });
}
function toggleMute(id) {
  const t = S.run ? S.run.tpl : tpl();
  const tr = t.tracks.find(x => x.id === id) || track(id); if (!tr) return;
  if (S.mutes.has(id)) S.mutes.delete(id); else S.mutes.add(id);
  saveMutes();
  renderLanes(); tick();
  if (S.run && A.ctx && A.ctx.state === "running") schedule();
  flash(isMuted(id) ? `${tr.name} muted for you` : `${tr.name} unmuted`);
}
function flipLanes(mutate) {
  // smooth slide for the other rows when the order changes
  const before = {};
  document.querySelectorAll("#lanes .lane").forEach(l => before[l.dataset.id] = l.getBoundingClientRect().top);
  mutate();
  document.querySelectorAll("#lanes .lane").forEach(l => {
    const b = before[l.dataset.id]; if (b === undefined) return;
    const d = b - l.getBoundingClientRect().top;
    if (d && l.animate) l.animate([{transform: `translateY(${d}px)`}, {transform: "none"}], {duration: 170, easing: "cubic-bezier(.2,.8,.2,1)"});
  });
}
function reorderLane(e, id) {
  if (!canEdit()) return;
  e.preventDefault(); e.stopPropagation();
  const t = tpl(), before = JSON.stringify(t);
  const laneEl = document.querySelector(`.lane[data-id="${id}"]`);
  if (!laneEl) return;
  const r = laneEl.getBoundingClientRect(), grabY = e.clientY - r.top;
  // floating copy of the row that follows the mouse
  const ghost = laneEl.cloneNode(true);
  ghost.classList.add("ghost"); ghost.classList.remove("sel");
  Object.assign(ghost.style, {left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px"});
  document.body.appendChild(ghost);
  S.reorderId = id; S.dragging = true; hideTip();
  laneEl.classList.add("ph");
  document.body.classList.add("reordering");
  let moved = false;
  const move = ev => {
    const box = $("#lanes").getBoundingClientRect();
    const y = Math.max(box.top - r.height / 2, Math.min(box.bottom - r.height / 2, ev.clientY - grabY));
    ghost.style.top = y + "px";
    const mid = y + r.height / 2;
    const others = [...document.querySelectorAll("#lanes .lane")].filter(l => l.dataset.id !== id);
    let to = others.findIndex(l => { const lr = l.getBoundingClientRect(); return mid < lr.top + lr.height / 2; });
    if (to < 0) to = others.length;
    const from = t.tracks.findIndex(x => x.id === id);
    if (to !== from) {
      flipLanes(() => { const [tr] = t.tracks.splice(from, 1); t.tracks.splice(to, 0, tr); renderLanes(); });
      moved = true;
    }
  };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    document.body.classList.remove("reordering");
    const slot = document.querySelector(`.lane[data-id="${id}"]`);
    const finish = () => {
      ghost.remove(); S.reorderId = null; S.dragging = false;
      if (moved) { pushUndo(before, "Order changed"); save(); liveChanged(); }
      renderLanes(); tick();
    };
    if (slot) {
      // glide the copy into its new spot, then swap back to the real row
      ghost.style.transition = "top .14s ease-out, transform .14s ease-out, box-shadow .14s";
      ghost.style.top = slot.getBoundingClientRect().top + "px";
      ghost.classList.add("drop");
      setTimeout(finish, 150);
    } else finish();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}
function typeBox(cls, value, host, left, onDone) {
  const inp = document.createElement("input");
  inp.className = cls; inp.value = value; inp.style.left = left;
  host.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const finish = keep => { if (done) return; done = true; const v = inp.value; inp.remove(); onDone(keep ? v : null); };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);

function editCount(tr, laneEl) {

  typeBox("pillin", tr.count === 1 ? 2 : tr.count, laneEl, pill.style.left, v => {

    if (v === null || isNaN(n) || n === tr.count) return;
    editTpl("Times changed", () => { tr.count = Math.max(1, Math.min(200, n)); if (tr.count > 1 && !tr.every) tr.every = 60; });
  });
}
function editLength() {
  const t = tpl(), bar = $("#ruler"), h = $("#endh");
  h.style.visibility = "hidden";
  typeBox("endin", fmt(t.length, true), bar, h.style.left, v => {

function nudge(dir, fine) {

  const step = fine ? 0.1 : 1;

/* ---------- inspector ---------- */

let uploadCb = null;
function upload(cb) { uploadCb = cb || null; $("#fileIn").value = ""; $("#fileIn").click(); }
$("#fileIn").onchange = e => addFiles(e.target.files, uploadCb);
async function addFiles(files, cb) {
  let lastId = null;
  for (const f of files) {
    if (!f.type.startsWith("audio/")) { flash(`${f.name} isn't a sound file`); continue; }
    if (f.size > 5 * 1024 * 1024) { flash(`${f.name} is over 5 MB`); continue; }
    const rec = {id:"c_" + uid(), name:f.name.replace(/\.[^.]+$/, "").slice(0, 40), blob:f};
    S.custom[rec.id] = rec; await idb.put(rec); lastId = rec.id;
  }
  renderSounds(); renderInspector();
  if (lastId) { flash(files.length > 1 ? "Sounds added" : "Sound added"); if (cb) cb(lastId); }
}

const b64u = {
  enc: bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
  dec: str => Uint8Array.from(atob(str.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0))
};
async function pipe(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function encodePreset(t) {
  const data = JSON.stringify({n: t.name, l: t.length, t: t.tracks.map(x => [x.name, x.color, x.sound, null, x.first, x.every, x.count, x.each && Object.keys(x.each).length ? x.each : 0])});
  const raw = new TextEncoder().encode(data);
  if (window.CompressionStream) {
    try { return "z" + b64u.enc(await pipe(raw, new CompressionStream("deflate-raw"))); } catch (e) {}
  }
  return "j" + b64u.enc(raw);
}
async function decodePreset(code) {
  let bytes = b64u.dec(code.slice(1));
  if (code[0] === "z") bytes = await pipe(bytes, new DecompressionStream("deflate-raw"));
  const d = JSON.parse(new TextDecoder().decode(bytes));
  const num = (v, lo, hi, dflt) => { v = +v; return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt; };
  let missing = 0;
  const known = id => { if (id && (BUILTIN[id] || S.custom[id])) return id; if (id) missing++; return null; };
  const tracks = (d.t || []).slice(0, 20).map((x, i) => ({
    id: uid(),
    name: String(x[0] || "Timer").slice(0, 40),
    color: COLORS.includes(x[1]) ? x[1] : COLORS[i % COLORS.length],
    sound: known(x[2]) || "meow1",
    last: x[3] ? (known(x[3]) || "meow1") : null,
    each: (() => {
      const out = {};
      if (x[7] && typeof x[7] === "object") Object.keys(x[7]).slice(0, 200).forEach(k => {
        const i = parseInt(k, 10), v = x[7][k];
        if (i >= 0 && i < 200) out[i] = v === "off" ? "off" : (known(v) || "meow1");
      });
      return out;
    })(),
    first: num(x[4], 0, 86400, 0),
    every: num(x[5], 0, 86400, 0),
    count: Math.round(num(x[6], 1, 200, 1))
  }));
  tracks.forEach(migrateLast);
  if (!tracks.length) throw new Error("empty preset");
  return {t: {id: uid(), name: String(d.n || "Shared preset").slice(0, 40), length: num(d.l, 30, 86400, 1800), tracks}, missing};
}
async function copyLink() {
  const url = location.origin + location.pathname + "#p=" + await encodePreset(tpl());
  try { await navigator.clipboard.writeText(url); flash("Link copied"); }
  catch (e) { prompt("Copy this link", url); }
}
$("#shareBtn").onclick = copyLink;

/* ---------- lobby connection ---------- */
const LOBBY_URL = new URLSearchParams(location.search).get("server") || "wss://farm.ima.moe/ws";
const N = {ws: null, state: "off", offset: 0, best: Infinity, room: null, chat: [], lobby: null, retry: 0, pending: null, wantOpen: false, people: {}};
function connect() {
  if (N.ws && N.ws.readyState <= 1) return;
  N.wantOpen = true; N.state = "connecting"; renderNet();
  let ws;
  try { ws = new WebSocket(LOBBY_URL); } catch (e) { N.state = "off"; renderNet(); return; }
  N.ws = ws;
  ws.onopen = () => {
    N.state = "on"; N.retry = 0; N.best = Infinity; renderNet();
    send({t: "hello", cid: ME.cid, name: ME.name, color: ME.color});
    for (let i = 0; i < 5; i++) setTimeout(() => send({t: "ping", c: Date.now()}), i * 250);
  };
  ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    if (N.ws !== ws) return;
    N.ws = null; N.state = "off"; renderNet();
    if (N.wantOpen) setTimeout(connect, Math.min(10000, 800 * Math.pow(2, N.retry++)));
  };
}
function send(m) { if (N.ws && N.ws.readyState === 1) N.ws.send(JSON.stringify(m)); }
setInterval(() => { if (N.state === "on") send({t: "ping", c: Date.now()}); }, 30000);
// "ZYTE", "zyte" or a pasted invite link (...#room=ZYTE) -> "ZYTE"
function roomCodeFrom(text) {
  text = String(text || "");
  const m = text.match(/room=([A-Za-z]+)/i);
  if (m) return m[1].toUpperCase();
  const words = text.match(/[A-Za-z]+/g) || [];
  if (text.includes("/")) return (words[words.length - 1] || "").toUpperCase();   // some other link
  return words.join("").toUpperCase().slice(0, 12);
}
function joinCode(code) {
  code = roomCodeFrom(code);
  if (!code) return;
  N.pending = code;
  if (N.state === "on") send({t: "join", code}); else connect();
}
let pushTimer;
function templatePayload(t) {
  const names = {};
  t.tracks.forEach(tr => [tr.sound, tr.last].concat(Object.values(tr.each || {})).forEach(id => { if (id && S.custom[id]) names[id] = S.custom[id].name; }));
  return {name: t.name, length: t.length, tracks: t.tracks.map(x => { const c = Object.assign({}, x); delete c.muted; return c; }), names};
}
function pushTemplate() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { if (isMaster()) send({t: "template", template: templatePayload(tpl())}); }, 250);
}

function onMsg(m) {
  switch (m.t) {
    case "pong": {
      const rtt = Date.now() - m.c;
      if (rtt <= N.best) { N.best = rtt; N.offset = m.s - (m.c + rtt / 2); }
      break;
    }
    case "welcome": {
      const saved = sessionStorage.getItem("ft.room");
      if (N.pending) send({t: "join", code: N.pending});
      else if (saved) send({t: "join", code: saved});
      break;
    }
    case "lobby": N.lobby = m.rooms; renderRoomList(); break;
    case "joined":
      N.pending = null;
      sessionStorage.setItem("ft.room", m.code);
      N.chat = m.chat || [];
      S.showLobby = false;
      break;
    case "room": applyRoom(m.room); break;
    case "chat": N.chat.push(m.line); if (N.chat.length > 80) N.chat.shift(); addChatLine(m.line, true); break;
    case "left": leftRoom(m.reason); break;
    case "error":
      flash(m.msg);
      if (N.pending) { if (sessionStorage.getItem("ft.room") === N.pending) sessionStorage.removeItem("ft.room"); N.pending = null; }
      else if (m.code === "nocode") sessionStorage.removeItem("ft.room");
      break;
  }
}

function applyRoom(room) {
  const prev = N.room;
  const wasGuest = isGuest();
  N.room = room;
  // latest name + color of everyone seen in this room, so old chat lines follow renames and color changes
  let peopleChanged = false;
  room.members.forEach(m => {
    const was = N.people[m.cid];
    if (!was || was.name !== m.name || was.color !== m.color) { N.people[m.cid] = {name: m.name, color: m.color}; peopleChanged = true; }
  });
  if (peopleChanged && prev && prev.code === room.code) renderChat();
  if (room.master !== ME.cid) S.roomTpl = room.template;
  if (prev && prev.code === room.code && prev.master !== ME.cid && room.master === ME.cid) adoptRoomPreset();
  if (!prev || prev.code !== room.code) { S.sel = null; renderChat(); }

  if (room.check) { hideEnd(); showReady(); }
  else if (!S.counting) hideReady();

  if (room.run) {
    const startLocal = room.run.start_at - N.offset;
    if (!S.run || S.run.id !== "room" || Math.abs(S.run.start - startLocal) > 80) startRoomRun(room.run);
    else if (JSON.stringify(S.run.tpl) !== JSON.stringify(room.run.template)) { S.run.tpl = room.run.template; schedule(); }
  } else if (S.run && S.run.id === "room") {
    stopLocal();
    if (room.ended && room.ended.start_at === (prev && prev.run && prev.run.start_at)) showEnd(room.ended);
  } else if (room.ended && prev && prev.run && room.ended.start_at === prev.run.start_at) {
    showEnd(room.ended);
  }

  renderRoom(); renderControls(); renderGuestMode(); renderLobby();
  if (isGuest() || wasGuest) { renderLanes(); renderInspector(); }
  tick();
}
function adoptRoomPreset() {
  // the old room master left: keep the room's preset so nothing changes for anyone
  const rt = S.roomTpl || N.room.template;
  const shape = t => JSON.stringify([t.name, t.length, t.tracks.map(x => [x.name, x.color, x.sound, x.first, x.every, x.count, Array.from({length: x.count}, (_, i) => soundAt(x, i))])]);
  const same = S.templates.find(x => shape(x) === shape(rt));
  if (same) { S.cur = same.id; S.roomTpl = null; localStorage.setItem(KEY.cur, S.cur); renderTemplates(); flash("You're the Room Host now"); return; }
  const copy = JSON.parse(JSON.stringify(rt));
  copy.id = uid(); delete copy.names;
  const names = new Set(S.templates.map(x => x.name));
  let name = copy.name, n = 2;
  while (names.has(name)) name = `${copy.name} (${n++})`;
  copy.name = name;
  S.templates.push(copy); S.cur = copy.id; S.roomTpl = null;
  localStorage.setItem(KEY.tpl, JSON.stringify(S.templates)); localStorage.setItem(KEY.cur, S.cur);
  renderTemplates(); flash("You're the Room Host now");
}
async function startRoomRun(run) {
  cancelScheduled();
  if (S.run && S.run.id !== "room") localStorage.removeItem(KEY.run);
  S.run = {start: run.start_at - N.offset, serverStart: run.start_at, tpl: run.template, id: "room"};
  renderControls(); renderLanes(); tick();
  scheduleCountdown(S.run.start);
  try { await schedule(); } catch (e) { console.warn(e); }
}
function leftRoom(reason) {
  const wasGuest = isGuest();
  N.room = null; S.roomTpl = null; N.chat = []; N.pending = null;
  sessionStorage.removeItem("ft.room");
  if (S.run && S.run.id === "room") stopLocal();
  hideReady(); hideEnd();
  if (reason) flash(reason);
  S.showLobby = true;
  renderRoom(); renderGuestMode(); renderControls(); renderLobby();
  if (wasGuest) { renderLanes(); renderInspector(); }
  send({t: "lobby"});
}

/* ---------- "are you sure?" popup ---------- */
function confirmBox(o) {
  return new Promise(resolve => {
    $("#confAv").innerHTML = o.art || ""; $("#confAv").hidden = !o.art;
    $("#confTitle").textContent = o.title;
    $("#confText").textContent = o.text || ""; $("#confText").hidden = !o.text;
    $("#confYes").textContent = o.ok || "OK";
    const m = $("#confirmModal");
    const done = v => { m.classList.remove("show"); document.removeEventListener("keydown", key, true); resolve(v); };
    const key = e => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); done(true); }
    };
    $("#confYes").onclick = () => done(true);
    $("#confNo").onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.addEventListener("keydown", key, true);
    m.classList.add("show");
    $("#confYes").focus();
  });
}

/* ---------- end popup ---------- */
function showEnd(info) {
  // info: {reason: "done" | "stopped", by, start_at, at, template}
  if (!info || S.endShown === info.start_at) return;
  S.endShown = info.start_at;
  hideReady();
  const t = info.template, done = info.reason === "done";
  uiSound("stop");
  const ranFor = done ? t.length : Math.max(0, Math.min(t.length, (info.at - info.start_at) / 1000));
  $("#endIcon").className = "endicon" + (done ? "" : " stopped");
  $("#endIcon").innerHTML = done ? ICON.check : ICON.stop;
  $("#endTitle").textContent = done ? "Farming done" : "Farming stopped";
  $("#endMeta").textContent = done ? `Ran the full ${fmt(t.length)}` : `${info.by ? "Stopped by " + info.by : "Stopped"} at ${fmt(Math.floor(ranFor))}`;
  const evs = visible(t);
  $("#endStats").innerHTML = t.tracks.map(tr => {
    const mine = evs.filter(e => e.tr.id === tr.id), played = mine.filter(e => e.at <= ranFor + 0.5).length;
    if (!mine.length) return "";
    const val = isMuted(tr.id) ? "muted" : mine.length > 1 ? `${played}/${mine.length}` : (played ? "\u2713" : "skipped");
    const full = !isMuted(tr.id) && played === mine.length;
    return `<div class="st" style="--c:${tr.color}"><span class="dot"></span><span class="nm">${esc(tr.name)}</span><span class="v ${full ? "full" : ""}">${val}</span></div>`;
  }).join("");
  const again = isMaster() ? `<button class="btn big accent" id="endAgain">${ICON.restart}Run again</button>` : "";
  $("#endBtns").innerHTML = again + `<button class="btn big ${again ? "ghost" : "accent"}" id="endOk">${again ? "Close" : "OK"}</button>`;
  $("#endModal").classList.add("show");
  $("#endOk").onclick = hideEnd;
  if (again) $("#endAgain").onclick = () => { hideEnd(); ensureAudio(); send({t: "start"}); };
  $("#endOk").focus();
}

/* ---------- ready check ---------- */
async function toggleReady() {
  await ensureAudio();   // the click unlocks sound, so the timer can play when it starts
  const me = N.room && N.room.members.find(m => m.cid === ME.cid);
  send({t: "ready", value: !(me && me.ready)});
}
function seatRow(m, extra, no) {
  const r = N.room;
  const crown = m.cid === r.master ? `<span class="crown" data-tip="Room Host" aria-label="Room Host"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg></span>` : "";
  return `<div class="seat ${m.online ? "" : "off"}">${no ? `<span class="seatno">${no}</span>` : ""}${avatar(m.name, m.color, m.cid)}<span class="nm">${esc(m.name)}${m.cid === ME.cid ? '<span class="you">you</span>' : ""}</span>${crown}${extra || ""}</div>`;
}
function readyMark(m) { return `<span class="rstate ${m.ready ? "ok" : ""}">${m.ready ? ICON.check : "&middot;"}</span>`; }
function showReady() {
  const r = N.room; if (!r) return;
  if (!$("#readyModal").classList.contains("show") || S.counting) uiSound("ready");
  S.counting = false;
  $("#readyModal").classList.add("show");
  $("#rdyTitle").textContent = "Ready check";
  $("#rdyCount").hidden = true;
  $("#rdyTime").hidden = !r.check_until;
  readyTimer();
  $("#rdySeats").innerHTML = r.members.map(m => seatRow(m, readyMark(m))).join("");
  const me = r.members.find(m => m.cid === ME.cid), meReady = !!(me && me.ready);
  $("#rdyBtns").innerHTML = `<button class="btn big ${meReady ? "" : "good"}" id="rdyBtn">${meReady ? "Not ready" : ICON.check + "Ready"}</button>` +
    (isMaster() ? `<button class="btn big ghost" id="rdyCancel">Cancel</button>` : "");
  $("#rdyBtn").onclick = toggleReady;
  if (isMaster()) $("#rdyCancel").onclick = () => send({t: "cancel"});
}
function readyTimer() {
  const r = N.room;
  if (!r || !r.check || !r.check_until || S.counting) return;
  const left = Math.max(0, (r.check_until - Date.now() - N.offset) / 1000);
  $("#rdyBar").style.width = Math.min(100, left / 30 * 100) + "%";
  $("#rdyBar").classList.toggle("low", left <= 10);
  $("#rdyLeft").textContent = Math.ceil(left) + "s";
}
function showCountdown(n) {
  if (!S.counting) {
    S.counting = true;
    $("#rdyTime").hidden = true;
    $("#readyModal").classList.add("show");
    $("#rdyTitle").textContent = "Starting";
    $("#rdySeats").innerHTML = ""; $("#rdyBtns").innerHTML = "";
    $("#rdyCount").hidden = false;
    // update often while counting, so each number shows right when it's said
    const fast = () => { if (!S.counting) return; tick(); setTimeout(fast, 30); };
    setTimeout(fast, 30);
  }
  if ($("#rdyCount").textContent != n) $("#rdyCount").textContent = n;
}
function hideReady() { S.counting = false; $("#readyModal").classList.remove("show"); }

/* ---------- lobby + room panels ---------- */
function renderNet() {
  const d = $("#netDot");
  d.className = "netdot " + (N.state === "on" ? "on" : N.state === "connecting" ? "connecting" : "");
  renderRoomList();
}
function renderLobby() {
  const show = !!S.showLobby && !inRoom();
  $("#lobbyPanel").hidden = !show;
  $("#lobbyTx").textContent = inRoom() ? N.room.code : "Rooms";
  $("#modeBadge").hidden = inRoom();
  if (show) { $("#cTitle").placeholder = tpl().name; renderRoomList(); }
}
function roomCard(r) {
  const seats = Array.from({length: r.max}, (_, i) => `<i class="${i < r.count ? "f" : ""}"></i>`).join("");
  const full = r.count >= r.max;
  const badge = r.run ? `<span class="badge live" data-end="${r.run.start_at + r.run.length * 1000}"></span>` : `<span class="badge">${esc(r.preset)}</span>`;
  return `<div class="roomcard"><div class="tt">${esc(r.title)}</div>${r.desc ? `<div class="ds">${esc(r.desc)}</div>` : ""}
    <div class="bt"><span class="seats">${seats}</span>${badge}<span class="spacer"></span>
    <button class="btn ${full ? "" : "accent"}" data-join="${r.code}" ${full ? "disabled" : ""}>${full ? "Full" : "Join"}</button></div></div>`;
}
function renderRoomList() {
  const box = $("#roomList");
  if (!box || $("#lobbyPanel").hidden) return;
  if (N.state !== "on") {
    box.innerHTML = N.state === "connecting" ? `<div class="empty">Connecting...</div>` :
      `<div class="empty">Can't reach the room server<button class="btn" id="retryBtn">Retry</button></div>`;
    const rb = $("#retryBtn"); if (rb) rb.onclick = connect;
    return;
  }
  const rooms = N.lobby || [];
  box.innerHTML = rooms.length ? `<div class="rooms">${rooms.map(roomCard).join("")}</div>` : `<div class="empty">No public rooms yet. Make one!</div>`;
  box.querySelectorAll("[data-join]").forEach(b => b.onclick = () => joinCode(b.dataset.join));
  tick();
}
function segValue(el) { return el.querySelector("button.on").dataset.v === "1"; }
function wireSeg(el) { el.querySelectorAll("button").forEach(b => b.onclick = () => { el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }); }
function setSeg(el, pub) { el.querySelectorAll("button").forEach(x => x.classList.toggle("on", (x.dataset.v === "1") === pub)); }
wireSeg($("#cVis")); wireSeg($("#eVis"));

$("#lobbyBtn").onclick = () => {
  if (inRoom()) { $("#roomPanel").scrollIntoView({behavior: "smooth", block: "center"}); return; }
  S.showLobby = !S.showLobby;
  if (S.showLobby) { connect(); send({t: "lobby"}); }
  renderLobby();
};
$("#lobbyClose").onclick = () => { S.showLobby = false; renderLobby(); };
$("#newRoomBtn").onclick = () => { const f = $("#createForm"); f.classList.toggle("show"); if (f.classList.contains("show")) $("#cTitle").focus(); };
$("#cGo").onclick = () => {
  if (N.state !== "on") { flash("Not connected to the room server yet"); connect(); return; }
  send({t: "create", title: $("#cTitle").value || $("#cTitle").placeholder, desc: $("#cDesc").value, public: segValue($("#cVis")), template: templatePayload(tpl())});
  $("#createForm").classList.remove("show"); $("#cTitle").value = ""; $("#cDesc").value = "";
};
$("#codeIn").addEventListener("input", () => {
  const el = $("#codeIn"), code = roomCodeFrom(el.value);
  if (el.value !== code) el.value = code;
});
$("#codeForm").onsubmit = e => { e.preventDefault(); const v = $("#codeIn").value; $("#codeIn").value = ""; joinCode(v); };

function inviteLink() { return location.origin + location.pathname + "#room=" + N.room.code; }
function renderRoom() {
  const p = $("#roomPanel"), r = N.room;
  p.hidden = !r;
  $(".wrap").classList.toggle("inroom", !!r);
  if (!r) { $("#rForm").classList.remove("show"); return; }
  $("#rTitle").textContent = r.title;
  $("#rVis").textContent = r.public ? "Public" : "Private";
  $("#rCode").innerHTML = `${esc(r.code)}${ICON.copy}`;
  $("#rDesc").textContent = r.desc || "";
  $("#rDesc").hidden = !r.desc;
  $("#rEdit").hidden = !isMaster();
  $("#rSave").hidden = isMaster();
  if (!isMaster()) $("#rForm").classList.remove("show");
  const byCid = {};
  r.members.forEach(m => byCid[m.cid] = m);
  const seats = (r.seats || r.members.map(m => m.cid)).map((cid, i) => {
    const m = cid && byCid[cid];
    if (!m) return `<button class="seat open" data-seat="${i}"><span class="seatno">${i + 1}</span>Open seat</button>`;
    let acts = "";
    if (isMaster() && m.cid !== ME.cid) {
      acts = `<span class="acts"><button class="kick" data-host="${esc(m.cid)}" data-tip="Make Room Host" aria-label="Make ${esc(m.name)} the Room Host"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg></button>` +
        `<button class="kick" data-kick="${esc(m.cid)}" data-tip="Remove" aria-label="Remove ${esc(m.name)}">${ICON.x}</button></span>`;
    }
    return seatRow(m, (r.check ? readyMark(m) : "") + acts, i + 1);
  });
  $("#rSeats").innerHTML = seats.join("");
  // the Discord bot playing this room's timer in voice (/farm code)
  const bots = r.watchers || [];
  $("#rBots").hidden = !bots.length;
  $("#rBots").innerHTML = bots.map(w => `<div class="vbot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span><b>${esc(w.name)}</b> is in voice${w.where ? " \u00b7 " + esc(w.where) : ""}</span></div>`).join("");
  $("#rSeats").querySelectorAll("[data-kick]").forEach(b => b.onclick = () => send({t: "kick", cid: b.dataset.kick}));
  $("#rSeats").querySelectorAll("[data-host]").forEach(b => b.onclick = async () => {
    const m = N.room && N.room.members.find(x => x.cid === b.dataset.host);
    if (!m) return;
    const yes = await confirmBox({
      art: avatar(m.name, m.color, m.cid) + `<span class="crown"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg></span>`,
      title: `Make ${m.name} the Room Host?`,
      text: "You won't be able to edit the preset or start farming.",
      ok: "Make Host"
    });
    if (yes) send({t: "host", cid: m.cid});
  });
  $("#rSeats").querySelectorAll("[data-seat]").forEach(b => b.onclick = () => send({t: "seat", seat: +b.dataset.seat}));
  renderRoomActions();
}
function renderRoomActions() {
  const box = $("#roomActions"), r = N.room;
  if (!box || !r) return;
  const me = r.members.find(m => m.cid === ME.cid), meReady = !!(me && me.ready);
  const master = r.members.find(m => m.cid === r.master);
  if (roomFarming()) {
    box.innerHTML = isMaster() ? `<button class="btn big bad" id="raStop">${ICON.stop}Stop</button>` : `<span class="hint">Farming together</span>`;
    if (isMaster()) $("#raStop").onclick = stop;
  } else if (r.check) {
    box.innerHTML = `<div class="row"><button class="btn big ${meReady ? "" : "good"}" id="raReady">${meReady ? "Not ready" : ICON.check + "Ready"}</button>` +
      (isMaster() ? `<button class="btn big ghost" id="raCancel">Cancel</button>` : "") + `</div>`;
    $("#raReady").onclick = toggleReady;
    if (isMaster()) $("#raCancel").onclick = () => send({t: "cancel"});
  } else if (isMaster()) {
    box.innerHTML = `<button class="btn big accent" id="raStart">${ICON.play}Ready check</button>`;
    $("#raStart").onclick = () => { ensureAudio(); send({t: "start"}); };
  } else {
    box.innerHTML = `<span class="hint">Waiting for ${master ? nameHTML(master.name, master.color, master.cid, false) : "the Room Host"} to start</span>`;
  }
}
async function copyInvite() {
  try { await navigator.clipboard.writeText(inviteLink()); flash("Invite link copied"); }
  catch (e) { prompt("Copy this invite link", inviteLink()); }
}
$("#rCode").onclick = copyInvite;
$("#rLeave").onclick = () => send({t: "leave"});
$("#rEdit").onclick = () => {
  const f = $("#rForm"), r = N.room;
  f.classList.toggle("show");
  if (f.classList.contains("show")) { $("#eTitle").value = r.title; $("#eDesc").value = r.desc; setSeg($("#eVis"), r.public); $("#eTitle").focus(); }
};
$("#eGo").onclick = () => {
  send({t: "settings", title: $("#eTitle").value, desc: $("#eDesc").value, public: segValue($("#eVis"))});
  $("#rForm").classList.remove("show");
};
$("#rSave").onclick = () => {
  const copy = JSON.parse(JSON.stringify(S.roomTpl)); copy.id = uid(); delete copy.names;
  copy.tracks.forEach(x => {
    x.id = uid(); if (!hasSound(x.sound)) x.sound = "meow1"; migrateLast(x);
    Object.keys(x.each || {}).forEach(k => { if (x.each[k] !== "off" && !hasSound(x.each[k])) x.each[k] = "meow1"; });
  });
  const names = new Set(S.templates.map(x => x.name));
  let name = copy.name, n = 2;
  while (names.has(name)) name = `${copy.name} (${n++})`;
  copy.name = name; S.templates.push(copy);
  localStorage.setItem(KEY.tpl, JSON.stringify(S.templates));
  renderTemplates(); flash(`Saved as ${name}`);
};
function renderChat() {
  const log = $("#chatLog");
  log.innerHTML = "";
  N.chat.forEach(l => addChatLine(l, false));
  log.scrollTop = log.scrollHeight;
}
// system line: the player names in it are bold in their own color, like when they type
function sysLineHTML(l) {
  const text = String(l.text || "");
  let html = "", at = 0;
  (l.who || []).forEach(w => {
    const name = String(w.name || "");
    const i = name ? text.indexOf(name, at) : -1;
    if (i < 0) return;
    html += esc(text.slice(at, i)) + nameHTML(name, w.color, w.cid, !l.rename);
    at = i + name.length;
  });
  return html + esc(text.slice(at));
}
function addChatLine(l, scroll) {
  const log = $("#chatLog");
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const div = document.createElement("div");
  if (l.sys) { div.className = "sys" + (["good", "bad", "warn"].includes(l.tone) ? " " + l.tone : ""); div.innerHTML = sysLineHTML(l); }
  else div.innerHTML = `${nameHTML(l.name, l.color, l.cid, true)} ${esc(l.text)}`;
  log.appendChild(div);
  if (!scroll || near) log.scrollTop = log.scrollHeight;
}
$("#chatForm").onsubmit = e => {
  e.preventDefault();
  const v = $("#chatIn").value.trim();
  if (!v) return;
  $("#chatIn").value = "";
  if (v[0] === "/") {
    const cmd = v.slice(1).toLowerCase(), r = N.room;
    if (cmd === "start") {
      if (!isMaster()) flash("Only the Room Host can start");
      else if (r.run) flash("Already farming");
      else { ensureAudio(); send({t: "start"}); }
    } else if (cmd === "ready") {
      if (r.check) toggleReady(); else flash("No ready check right now");
    } else if (cmd === "stop") {
      if (isMaster()) stop(); else flash("Only the Room Host can stop");
    } else flash("Commands: /start /ready /stop");
    return;
  }
  send({t: "chat", text: v});
};
function renderGuestMode() {
  const g = isGuest(), lock = roomFarming();
  $("#lockVeil").hidden = !lock;
  $("#tlPanel").classList.toggle("farmlock", lock);
  $("#tplSel").disabled = lock; $("#tplMenuBtn").disabled = lock;
  if ($("#rEdit")) { $("#rEdit").disabled = lock; if (lock) $("#rForm").classList.remove("show"); }
  if (lock && S.sel) { S.sel = null; renderInspector(); document.querySelectorAll(".lane.sel").forEach(l => l.classList.remove("sel")); }
  $("#tplSel").hidden = g; $("#tplMenu").hidden = g;
  $("#guestPreset").hidden = !g;
  if (g) $("#guestPreset").textContent = S.roomTpl.name;
  $("#addTrack").hidden = g || lock;
  $("#timeline").classList.toggle("locked", g);
  if (g) S.sel = null;
}

function renderAll() { renderTemplates(); renderControls(); renderLanes(); renderInspector(); renderSounds(); renderName(); renderGuestMode(); renderRoom(); renderLobby(); renderNet(); }

(async function init() {
  load();
  try { await idb.open(); (await idb.all()).forEach(r => S.custom[r.id] = r); } catch (e) { console.warn("sound storage unavailable", e); }
  if (S.run && elapsed() >= S.run.tpl.length) { S.run = null; localStorage.removeItem(KEY.run); }
  if (S.run) $("#resumeBtn").classList.add("show");
  renderAll();
  setInterval(tick, 250);
  if (sessionStorage.getItem("ft.room")) connect();
  checkImport();
})();
</script>
</body>
</html>
